# Creates the Kubernetes Ingress used to expose the application through an AWS ALB
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}

  # Defines AWS Load Balancer Controller settings for the application
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/scheme" | quote }}
    alb.ingress.kubernetes.io/target-type: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/target-type" | quote }}

spec:
  # Directs this Ingress resource to the AWS Load Balancer Controller
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}

            backend:
              service:
                name: {{ .Release.Name }}

                port:
                  number: {{ .Values.service.port }}
{{- end }}